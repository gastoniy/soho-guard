# Kampania końcowa (Z-3, Z-4) — blok statyczny r1 (RouterOS 7), po static-final-r2 (H8).
# Uruchamiać dopiero, gdy na r1 nie ma otwartego findingu `policy.dynamic.beacon`
# (ok. 2026-11-20 10:15 czasu polskiego); warunki wstępne H8 i tak zwrócą `invalid`.
# Każdy manifest statyczny ×3; POL-003 pominięty (ma już n = 11 i n = 14 z iteracji 1–3).
# BEN-002 raz, BEN-001 (samo tło, długie okno) na końcu, raz; dodatkowe przebiegi ręcznie (`run --target`). Pełny reset r1 na starcie (H4).
campaign_id: static-final-r1
description: "Kampania końcowa: POL-004/005/006, SITE-007/008 ×3 na r1, BEN-002 ×1, BEN-001 na końcu"
reset_at_start: [r1]
close_artifacts: true
steps:
  - { manifest: scenarios/policy/policy-proxy-enabled.yml,     target: r1, repeat: 3 }  # POL-004
  - { manifest: scenarios/policy/policy-api-plain-enabled.yml, target: r1, repeat: 3 }  # POL-005
  - { manifest: scenarios/policy/policy-winbox-public.yml,     target: r1, repeat: 3 }  # POL-006 (D-A)
  - { manifest: scenarios/site/site-ppp-secret.yml,            target: r1, repeat: 3 }  # SITE-007
  - { manifest: scenarios/site/site-user-add.yml,              target: r1, repeat: 3 }  # SITE-008
  - { manifest: scenarios/benign/benign-firewall-comment.yml,  target: r1, repeat: 1 }  # BEN-002
  - { manifest: scenarios/benign/benign-background.yml,        target: r1, repeat: 1 }  # BEN-001 (H8: na końcu)

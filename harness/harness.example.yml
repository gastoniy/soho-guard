# Wzorzec harness.yml. Plik właściwy: --config, $SOHO_HARNESS_CONFIG albo harness/harness.yml
# w repo (w .gitignore). Tylko adresy i ścieżki — żadnych wartości sekretów; katalog sekretów
# trzymaj poza repozytorium. Ścieżki względne liczone od katalogu pliku konfiguracji.
# Wszystkie wartości poniżej są przykładowe (adresy z RFC 5737).
site_lab:
  clone: /path/to/soho-guard-site-lab        # klon repo instalacji, tylko do odczytu (git fetch)
  remote: origin
  branch: main
ansible:
  inventory: /path/to/inventory.ini          # localhost z ansible_python_interpreter venv harnessu
  vault_password_file: /path/to/secrets/vault.pass
  # playbook_bin: ansible-playbook
  # timeout_s: 300
ca_path: /path/to/secrets/ca.crt             # CA do weryfikacji api-ssl routerów
ssh:
  config: /path/to/ssh_config                # Host per router: IdentityFile, UserKnownHostsFile, BatchMode
  known_hosts: /path/to/known_hosts          # osobny plik harnessu; pełny reset usuwa wpis routera (H4)
  # bin: ssh
  # scp_bin: scp
  # keygen_bin: ssh-keygen
  # timeout_s: 120
build_dir: /path/to/build                    # wyrenderowany baseline (0600), usuwany (shred) zaraz po wgraniu
# github:
#   bin: gh                                  # tylko odczyt PR/issue; zamykanie wyłącznie z --close-artifacts
artifacts:
  timeout_s: 300
  poll_s: 15
windows:                                     # H10: maksymalne okno „brak findingu” od t0 [s]
  benign: 2700
  control: 2700
# results_dir: domyślnie <repo>/harness/results
timing:
  cycle_s: 300
  avoid_window_s: 30
  apply_margin_s: 60
  poll_interval_s: 30
  report_grace_s: 120
  precondition_wait_s: 900
  heartbeat_lead_s: 720
  reset_offset_s: 40
  mgmt_poll_s: 10
  ssh_retry_s: 150
  ssh_ready_timeout_s: 600
  resolve_timeout_s: 5400                     # dynamic: czekanie na rozwiązanie findingu po resecie
endpoints:                                    # krok generate: endpoint → pula adresów (c2-lab na Kali)
  c2-lab:                                     # DYN-011a: kolejne powtórzenia biorą kolejny adres (H8)
    addresses: [192.0.2.60, 192.0.2.61, 192.0.2.62]
routers:
  r1:
    mgmt_address: 192.0.2.1
    vault_file: /path/to/secrets/vault-r1.yml   # zmienne vault_r1_*
    api_port: 8729
    mgmt_return_timeout_s: 180
    upload:                                     # pełny reset: nazwa na routerze → plik lokalny
      bl-api.crt: /path/to/secrets/r1-bl-api.crt
      bl-api.key: /path/to/secrets/r1-bl-api.key
      ansible.pub: /path/to/secrets/ansible.pub
      monitor.pub: /path/to/secrets/r1-monitor.pub
  r2:
    mgmt_address: 192.0.2.2
    vault_file: /path/to/secrets/vault-r2.yml   # zmienne vault_r2_*
    api_port: 8729
    mgmt_return_timeout_s: 420
    upload:                                     # RouterOS 6: klucze jako *_rsa.pub (baseline.rsc.j2)
      bl-api.crt: /path/to/secrets/r2-bl-api.crt
      bl-api.key: /path/to/secrets/r2-bl-api.key
      ansible_rsa.pub: /path/to/secrets/ansible.pub
      monitor_rsa.pub: /path/to/secrets/r2-monitor.pub

# /etc/netplan/60-monitor.yaml  (chmod 600; zastosować: sudo netplan try)
# Przed: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg -> network: {config: disabled}
#        50-cloud-init.yaml przeniesiony do /root/netplan-backup/
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:                                   # adapter 0 -> S1 eth3 (trunk 110,120)
      match: {macaddress: "0c:c7:7c:6e:00:00"}
      set-name: eth0
      dhcp4: false
      dhcp6: false
      link-local: []
    eth1:                                   # adapter 1 -> S2 eth3 (mirror, bez IP)
      match: {macaddress: "0c:c7:7c:6e:00:01"}
      set-name: eth1
      dhcp4: false
      dhcp6: false
      link-local: []
    eth2:                                   # adapter 2 -> NAT GNS3 (wyłącznie utrzymanie węzła)
      match: {macaddress: "0c:c7:7c:6e:00:02"}
      set-name: eth2
      dhcp4: true
      dhcp6: false
      dhcp4-overrides: {route-metric: 100}
  vlans:
    eth0.110:                               # -> R1
      id: 110
      link: eth0
      addresses: [10.100.1.10/24]
      routes:
        - {to: 10.100.1.0/24, scope: link, table: 101}
        - {to: default, via: 10.100.1.1, table: 101}
      routing-policy:
        - {from: 10.100.1.10, table: 101}
    eth0.120:                               # -> R2
      id: 120
      link: eth0
      addresses: [10.100.2.10/24]
      routes:
        - {to: 10.100.2.0/24, scope: link, table: 102}
        - {to: default, via: 10.100.2.1, table: 102}
      routing-policy:
        - {from: 10.100.2.10, table: 102}

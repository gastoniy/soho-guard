#!/usr/sbin/nft -f
# /etc/nftables.conf — czyści WYŁĄCZNIE własną tabelę (tabele Dockera zostają)
# Zmiany wczytywać: sudo systemctl reload nftables  (nie restart — patrz drop-in)
table inet filter
delete table inet filter

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    iifname "eth1" drop                                     # mirror: nic nie wchodzi do stosu
    iifname { "eth0.110", "eth0.120" } tcp dport 22 accept  # harness
    iifname { "eth0.110", "eth0.120" } udp dport 514 accept # syslog z routerów
    ip protocol icmp accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    iifname { "docker0", "br-*" } accept                    # tylko kontenery RITA
    oifname { "docker0", "br-*" } ct state established,related accept
  }
}

# /etc/rsyslog.d/10-soho-routers.conf
# Przed: sudo usermod -aG soho-agent syslog
#        sudo install -d -o syslog -g soho-agent -m 2750 /var/log/soho-guard
module(load="imudp")

ruleset(name="routers") {
  if $fromhost-ip == "10.100.1.1" then { action(type="omfile" file="/var/log/soho-guard/r1.log" fileCreateMode="0640") stop }
  if $fromhost-ip == "10.100.2.1" then { action(type="omfile" file="/var/log/soho-guard/r2.log" fileCreateMode="0640") stop }
  stop    # inne źródła odrzucane
}

input(type="imudp" address="10.100.1.10" port="514" ruleset="routers")
input(type="imudp" address="10.100.2.10" port="514" ruleset="routers")

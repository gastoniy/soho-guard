# /etc/systemd/system/agent@.service.d/test-branch.conf — timery na gałęzi testowej (decyzja 2026-11-09, T1/T2).
# Wzorzec do testu ciągłego przed main: tryb pełny (naprawy włączone), publikacja na test/timers.
# Instalacja: sudo install -D -m 0644 <ten plik> /etc/systemd/system/agent@.service.d/test-branch.conf
#             sudo systemctl daemon-reload
# Powrót na main: usunąć plik, daemon-reload. Pusta linia ExecStart= kasuje polecenie z jednostki.
[Service]
ExecStart=
ExecStart=/opt/soho-guard/venv/bin/python -m agent --router %i --once --trigger timer --publish-branch test/timers

# /etc/tmpfiles.d/soho-guard.conf — retencja danych lokalnych agenta (decyzja 2026-11-09, S4).
# Czyści systemd-tmpfiles-clean.timer (raz na dobę). Wiek liczony po najnowszym z atime/mtime/ctime.
# Typ "e" usuwa wyłącznie zawartość katalogu starszą niż podany wiek; katalog zostaje.
# Nie obejmuje outboxu, stanu, runtime.json, l2-samples.json, rita.json ani cache TI.
# Ścieżki gałęzi: publish/main/<router> oraz publish/test/<nazwa>/<router>.
#
# Typ  Ścieżka                                              Tryb Uż. Gr. Wiek
e      /var/lib/soho-guard/publish/*/*/evidence             -    -   -   30d
e      /var/lib/soho-guard/publish/test/*/*/evidence        -    -   -   30d
e      /var/lib/soho-guard/dry-run/*/evidence               -    -   -   30d
e      /var/lib/soho-guard/publish/*/*/orphaned             -    -   -   7d
e      /var/lib/soho-guard/publish/test/*/*/orphaned        -    -   -   7d

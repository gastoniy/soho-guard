---
# POL-003: SOCKS proxy włączony (reguła policy.services.socks.disabled, z remediate).
# apply: włączenie /ip socks; revert (--tags revert): powrót do baseline (enabled=no).
- name: POL-003 — SOCKS proxy włączony
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/router.yml
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ router_host }}"
      port: "{{ router_api_port }}"
      username: "{{ routeros_user }}"
      password: "{{ routeros_password }}"
      tls: true
      validate_certs: true
      validate_cert_hostname: false
      ca_path: "{{ router_ca_path }}"
  tasks:
    - name: apply — włącz /ip socks
      community.routeros.api_modify:
        path: ip socks
        data:
          - enabled: true
      no_log: "{{ harness_no_log }}"
      tags: [apply]

    - name: revert — wyłącz /ip socks
      community.routeros.api_modify:
        path: ip socks
        data:
          - enabled: false
      no_log: "{{ harness_no_log }}"
      tags: [revert, never]

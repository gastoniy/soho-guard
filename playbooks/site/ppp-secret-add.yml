---
# SITE-007: nowy sekret PPP spoza inwentarza (H6) → drift lokalny local.ppp.secrets.
# apply: dodanie /ppp secret; hasło losowane przy każdym przebiegu, nigdzie niezapisywane (no_log).
# revert (--tags revert): usunięcie sekretu o tej nazwie. Nazwa zgodna z harness/probes.py (SITE007_SECRET).
- name: SITE-007 — nowy sekret PPP poza inwentarzem
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/router.yml
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ router_host }}"
      port: "{{ router_api_port }}"
      username: "{{ routeros_user }}"
      password: "{{ routeros_password }}"
      tls: true
      validate_certs: true
      validate_cert_hostname: false
      ca_path: "{{ router_ca_path }}"
  vars:
    site007_name: harness-site-007
  tasks:
    - name: apply — dodaj /ppp secret
      community.routeros.api:
        path: ppp secret
        add: >-
          name={{ site007_name }}
          password={{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}
          service=any comment=harness-SITE-007
      no_log: true
      tags: [apply]

    - name: revert — znajdź sekret
      community.routeros.api:
        path: ppp secret
        query: ".id name WHERE name == {{ site007_name }}"
      register: site007_found
      no_log: "{{ harness_no_log }}"
      tags: [revert, never]

    - name: revert — usuń sekret
      community.routeros.api:
        path: ppp secret
        remove: "{{ item['.id'] }}"
      # select('mapping'): wiersze wyniku (bez komunikatu "no results"); selectattr('.id') nie działa,
      # bo Jinja rozbija nazwę atrybutu po kropce.
      loop: "{{ site007_found.msg | select('mapping') | list }}"
      no_log: "{{ harness_no_log }}"
      tags: [revert, never]

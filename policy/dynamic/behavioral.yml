# Progi uniwersalne fazy dynamicznej (ADR-006). Allowlisty i "normalne"
# instalacji są lokalne (dynamic-baseline.yml) — tu tylko to, co zawsze złe.
# ioc=true → posture compromise-suspected → akcja alert (R8, bez remediacji).
layer: dynamic
rules:
  - id: policy.dynamic.ti-malicious
    title: "Ruch do destynacji o reputacji malicious/suspicious"
    severity: critical
    ioc: true
    phase: dynamic
    trace:
      attck: ["T1071"]
      timeline: "C2/proxy do znanych złych IP — TrickBot, Glupteba, FrostArmada"
    # W MVP TI sprawdza tylko cele findingów dynamicznych i potwierdza je
    # (evidence.l3_corroboration); osobny finding tej reguły nie powstaje.
    detector: ti
    assert: { verdict_not_in: ["malicious", "suspicious"] }

  - id: integrity.divergence.connections
    title: "Rozbieżność: przepływ widoczny w L2, nieobecny w self-reporcie routera"
    severity: critical
    ioc: true
    phase: dynamic
    trace:
      timeline: "ukryte sesje C2 — rdzeń modelu zagrożeń (ADR-003)"
    # Ścieżka szybka (DYN-011a): przepływy Zeeka z ostatnich 60 min zestawiane
    # z próbkami tablicy połączeń (L1), bez czekania na import RITA. Dowodem jest
    # tylko przepływ trwający w chwili próbki: L1 to migawka, krótszego połączenia
    # nie musi pokazywać. min_repeats = liczba różnych cykli z takim brakiem,
    # przy zerowej liczbie trafień celu w oknie.
    detector: zeek.conn
    assert: { diverges_from_l1: true, min_repeats: 3 }

  - id: policy.dynamic.beacon
    title: "Beaconing: periodyczne połączenia do stałego celu spoza allowlisty"
    severity: high
    ioc: true
    phase: dynamic
    trace:
      attck: ["T1071", "T1095"]
      timeline: "C2 beacon (TrickBot), dynamic-IP beaconing (Glupteba scheduler)"
    detector: rita.beacon
    assert: { score_max: 0.7 }

  - id: policy.dynamic.dga
    title: "Zapytania DNS o wysokiej entropii (DGA)"
    severity: high
    ioc: true
    phase: dynamic
    trace:
      attck: ["T1568.002"]
      timeline: "phone-home do domen DGA — ENDLESSDOORS"
    # Entropia Shannona najdłuższej etykiety bez TLD. Krótkie etykiety mają mało
    # wiarygodną entropię; jedna podejrzana nazwa to za mało (DGA generuje wiele).
    # Wyjątki (CDN) lokalnie: dynamic-baseline#dns.allowed_suffixes. Pomijane .arpa.
    detector: dns.dga
    assert: { entropy_max: 3.5, min_label_length: 12, min_distinct: 3 }

  - id: policy.dynamic.rogue-resolver
    title: "Zapytania DNS do resolvera spoza listy instalacji"
    severity: high
    ioc: true
    phase: dynamic
    trace:
      attck: ["T1071.004"]
      timeline: "DNS hijacking → AitM (FrostArmada/Operation Masquerade)"
    detector: dns.resolver
    # Odwołanie logiczne: plik dynamic-baseline routera agent bierze z inventory.yml
    # (pole dynamic_baseline) — polityka uniwersalna nie zna układu repo instalacji.
    assert: { allowed_from: "dynamic-baseline#dns.allowed_resolvers" }

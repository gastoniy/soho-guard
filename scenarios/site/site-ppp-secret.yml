schema_version: "1.0.0"
id: SITE-007
title: "Nowy sekret PPP poza inwentarzem (drift lokalny)"
class: site
target: { router_id: r2, profile: ros6 }
apply:
  # H6: dodanie sekretu. Zmiana samego hasła nie jest driftem (D6a,
  # wartości tajne poza migawką) — pokryte testem jednostkowym, bez scenariusza.
  playbook: playbooks/site/ppp-secret-add.yml
expect:
  detected: true
  phase: static
  rule: local.ppp.secrets
  rule_source: local
  posture: site-drift
  action: pr-alert
  end_state: unchanged
  # Budżet POL/SITE: cykl 300 s + odczyt L1 + zapas (decyzja 2026-11-12).
  max_detection_time_s: 420
teardown: { reset: true }

schema_version: "1.0.0"
id: SITE-007
title: "Zmiana sekretu PPP poza inwentarzem (drift lokalny)"
class: site
target: { router_id: r2, profile: ros6 }
apply:
  playbook: playbooks/site/ppp-secret-change.yml
expect:
  detected: true
  phase: static
  rule: local.ppp.secrets
  rule_source: local
  posture: site-drift
  action: pr-alert
  end_state: unchanged
  max_detection_time_s: 120
teardown: { reset: true }
